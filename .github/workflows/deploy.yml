name: Deploy to Cloud Run

# staging branch -> zero-sales-agent-staging, main -> zero-sales-agent.
# One-time GCP setup: scripts/gcp_setup.sh. Details: DEPLOYMENT.md.

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:   # re-run a deploy of the selected branch by hand

# One deploy per branch at a time, in push order. Never cancel one half way.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  AR_REPOSITORY: zero-sales-agent
  IMAGE_NAME: zero-sales-agent

jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.12.10 build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: code
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/
      GROQ_API_KEY: dummy-key-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q test

  deploy:
    needs: test
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.12.10 build
    # main deploys with the production GitHub environment, staging with
    # staging. Each holds the variables GCP_PROJECT, GCP_SA_KEY (the
    # github-deployer service account), APP_ENV, DB_NAME and DASHBOARD_URL.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      SERVICE: ${{ github.ref_name == 'main' && 'zero-sales-agent' || 'zero-sales-agent-staging' }}
      # Instances kept warm, from the environment's CLOUD_RUN_MIN_INSTANCES.
      # 0 scales to zero: the first request after a quiet spell waits for a
      # cold start.
      MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES }}
      # Each instance opens up to DB_POOL_MAX_SIZE (2) connections on the
      # shared database: this caps the total at 2 x MAX_INSTANCES.
      MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '3' }}
      # Requests one instance takes at once. Matches gunicorn's --threads 8 in
      # the Dockerfile: more would only queue inside gunicorn (and fight over
      # the 2 pooled DB connections) instead of making Cloud Run scale out.
      CONCURRENCY: ${{ vars.CLOUD_RUN_CONCURRENCY || '8' }}
      # The summary job stays paused unless this is "true".
      SCHEDULER_JOB_ENABLED: ${{ vars.CLOUD_SCHEDULER_ENABLED || 'false' }}
      SUMMARY_CRON: ${{ vars.PERIODIC_SUMMARY_CRON || '0 * * * *' }}
      # The database (Cloud SQL ai-agent-db) has only a private IP, so the
      # service reaches it through Direct VPC egress, like the project's other
      # Cloud Run services. Set VPC_NETWORK to "none" to turn this off.
      VPC_NETWORK: ${{ vars.VPC_NETWORK || 'default' }}
      VPC_SUBNET: ${{ vars.VPC_SUBNET || vars.VPC_NETWORK || 'default' }}
    steps:
      - name: Check the environment's variables
        # Before anything is built. This step logs only whether each one is
        # set, not its value.
        env:
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          missing=""
          for setting in \
            "GCP_PROJECT=${{ vars.GCP_PROJECT != '' }}" \
            "GCP_SA_KEY=${{ vars.GCP_SA_KEY != '' }}" \
            "APP_ENV=${{ vars.APP_ENV != '' }}" \
            "DB_NAME=${{ vars.DB_NAME != '' }}" \
            "DASHBOARD_URL=${{ vars.DASHBOARD_URL != '' }}" \
            "CLOUD_RUN_MIN_INSTANCES=${{ vars.CLOUD_RUN_MIN_INSTANCES != '' }}"; do
            [ "${setting#*=}" = "true" ] || missing="$missing ${setting%%=*}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the $ENVIRONMENT GitHub environment:$missing"
            exit 1
          fi
          # APP_ENV is the environment's own name, in lower case: the app
          # accepts nothing else, and neither do Cloud Run labels.
          if [ "$APP_ENV" != "$ENVIRONMENT" ]; then
            echo "::error::APP_ENV on the $ENVIRONMENT GitHub environment must be '$ENVIRONMENT'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          credentials_json: ${{ vars.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve names
        run: |
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RUNTIME_SA=zero-sales-agent-run@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "SCHEDULER_SA=zero-scheduler@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          # Audience of the OIDC token Cloud Scheduler sends. A fixed string
          # per service, so it is known before the service URL exists.
          echo "JOBS_AUDIENCE=${SERVICE}-jobs" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Write service environment
        # Plain settings. Secrets come from Secret Manager (--set-secrets below).
        env:
          DB_NAME: ${{ vars.DB_NAME }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          cat > "$RUNNER_TEMP/env.yaml" <<EOF
          APP_ENV: "${APP_ENV}"
          DB_NAME: "${DB_NAME}"
          DASHBOARD_URL: "${DASHBOARD_URL}"
          SCHEDULER_ENABLED: "false"
          JOBS_OIDC_AUDIENCE: "${JOBS_AUDIENCE}"
          JOBS_ALLOWED_INVOKERS: "${SCHEDULER_SA}"
          GROQ_MODEL_NAME: "${{ vars.GROQ_MODEL_NAME || 'openai/gpt-oss-120b' }}"
          SLACK_TIMEOUT: "10"
          PERIODIC_SUMMARY_TIMEZONE: "Asia/Kolkata"
          DB_APPLICATION_NAME: "${SERVICE}"
          EOF
          cat "$RUNNER_TEMP/env.yaml"

      - name: Deploy to Cloud Run (no traffic yet)
        run: |
          args=(
            --image "$IMAGE"
            --region "$REGION"
            --service-account "$RUNTIME_SA"
            --allow-unauthenticated
            --port 8080
            --cpu 1
            --memory 1Gi
            --concurrency "$CONCURRENCY"
            --timeout 900
            --cpu-boost
            --min-instances "$MIN_INSTANCES"
            --max-instances "$MAX_INSTANCES"
            --env-vars-file "$RUNNER_TEMP/env.yaml"
            --set-secrets "GROQ_API_KEY=GROQ_API_KEY:latest,DATABASE_URL=POSTGRES_URL:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest"
            --labels "app=zero-sales-agent,env=${APP_ENV},commit=${GITHUB_SHA::12}"
            --quiet
          )
          # Reach the database's private IP through Direct VPC egress. Only
          # private ranges go through the VPC; Groq and Slack go out directly.
          if [ "$VPC_NETWORK" != "none" ]; then
            args+=(--network "$VPC_NETWORK" --subnet "$VPC_SUBNET" --vpc-egress private-ranges-only)
          fi

          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            # Existing service: start the new revision without traffic and
            # give it the "candidate" URL, so it is checked before users see it.
            gcloud run deploy "$SERVICE" "${args[@]}" --no-traffic --tag candidate
            echo "FIRST_DEPLOY=false" >> "$GITHUB_ENV"
          else
            # First deploy: nothing to protect yet, --no-traffic is not allowed.
            gcloud run deploy "$SERVICE" "${args[@]}"
            echo "FIRST_DEPLOY=true" >> "$GITHUB_ENV"
          fi

      - name: Smoke test the new revision
        run: |
          if [ "$FIRST_DEPLOY" = "true" ]; then
            URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          else
            URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
              | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          fi
          echo "Checking $URL/health"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "$URL/health" || true)
            echo "attempt $i: HTTP $CODE $(cat /tmp/health.json 2>/dev/null)"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::New revision did not report a healthy database. Traffic was not moved."
          exit 1

      - name: Send traffic to the new revision
        if: env.FIRST_DEPLOY == 'false'
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet

      - name: Create or update the Cloud Scheduler job
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          JOB="${SERVICE}-periodic-summary"
          args=(
            --location "$REGION"
            --time-zone "Asia/Kolkata"
            --uri "${URL}/jobs/periodic-summary"
            --http-method POST
            --oidc-service-account-email "$SCHEDULER_SA"
            --oidc-token-audience "$JOBS_AUDIENCE"
            --attempt-deadline 900s
            --description "Periodic chat summary to Slack for ${SERVICE} (managed by GitHub Actions)"
            --quiet
          )
          job_state() {
            gcloud scheduler jobs describe "$JOB" --location "$REGION" --format='value(state)' 2>/dev/null || true
          }

          if [ -z "$(job_state)" ]; then
            # New job: a created job starts ENABLED. Create it on a schedule
            # that cannot fire soon (1 January) and pause it at once, so it
            # never runs before the state below is decided.
            gcloud scheduler jobs create http "$JOB" "${args[@]}" --schedule "0 0 1 1 *"
            gcloud scheduler jobs pause "$JOB" --location "$REGION" --quiet
          fi
          gcloud scheduler jobs update http "$JOB" "${args[@]}" --schedule "$SUMMARY_CRON"

          # Paused unless CLOUD_SCHEDULER_ENABLED=true. No "|| true": a pause
          # that fails must fail the deploy.
          if [ "$SCHEDULER_JOB_ENABLED" = "true" ]; then
            want=ENABLED
            [ "$(job_state)" = "ENABLED" ] || gcloud scheduler jobs resume "$JOB" --location "$REGION" --quiet
          else
            want=PAUSED
            [ "$(job_state)" = "PAUSED" ] || gcloud scheduler jobs pause "$JOB" --location "$REGION" --quiet
          fi
          state=$(job_state)
          if [ "$state" != "$want" ]; then
            echo "::error::$JOB is $state, expected $want."
            exit 1
          fi
          if [ "$want" = "PAUSED" ]; then
            echo "::warning::$JOB is paused. Set the repository variable CLOUD_SCHEDULER_ENABLED=true to run it."
          fi
          echo "SCHEDULER_STATE=$state" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          {
            echo "### Deployed ${SERVICE}"
            echo "- URL: ${URL}"
            echo "- Image: \`${IMAGE}\`"
            echo "- Environment: ${APP_ENV}"
            echo "- Summary job: ${SCHEDULER_STATE:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
